# CrowdStrike Falcon Deployment - Operator Custom Resource
# Generated by CrowdStrike Sensor Install Wizard
apiVersion: falcon.crowdstrike.com/v1alpha1
kind: FalconDeployment
metadata:
  name: falcon-deployment
spec:
  deployNodeSensor: true
  deployContainerSensor: false
  deployAdmissionController: true
  deployImageAnalyzer: true

  falcon_api:
    cloud_region: "autodiscover"
  falconSecret:
    enabled: true
    namespace: "falcon-system"
    secretName: "falcon-secrets"


  falconNodeSensor:
    installNamespace: falcon-system
    node:
      version: "8.10.0-19402-1"
      imagePullPolicy: Always
      terminationGracePeriod: 60
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0
      disableCleanup: false
      priorityClass:
        deploy: false
    falcon:
      trace: none
      billing: default
  falconAdmission:
    installNamespace: falcon-kac
    version: "8.10.0-3901"
    admissionConfig:
      imagePullPolicy: Always
      admissionControlEnabled: true
      failurePolicy: Ignore
      watcherEnabled: true
      snapshotsEnabled: true
      configMapWatcherEnabled: true
      snapshotsInterval: "22h"
      deployWatcher: true
      servicePort: 443
      containerPort: 4443
      replicas: 2
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
      resourcesClient:
        limits:
          memory: 384Mi
        requests:
          cpu: 250m
          memory: 384Mi
      resourcesClientNoWebhook:
        limits:
          memory: 128Mi
        requests:
          cpu: 100m
          memory: 128Mi
      resourcesWatcher:
        limits:
          memory: 384Mi
        requests:
          cpu: 250m
          memory: 384Mi
      falconImageAnalyzerNamespace: "falcon-image-analyzer"
    falcon:
      trace: none
      billing: default
    resourcequota:
      pods: "2"
  falconImageAnalyzer:
    installNamespace: falcon-image-analyzer
    version: "1.0.26"
    imageAnalyzerConfig:
      imagePullPolicy: Always
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      sizeLimit: "20Gi"
      mountPath: "/tmp"
      registryConfig:
        autoDiscoverCredentials: true
      debug: false
      iarAgentService:
        port: 8001
        certExpiration: 3650
      kac:
        namespace: "falcon-kac"
